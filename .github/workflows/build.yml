name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        shell: pwsh
        run: ./build.ps1 -NoPublish
      - name: Test toolbox
        shell: pwsh
        run: ./tools/Test-Toolbox.ps1
      - name: Test restore policy
        shell: pwsh
        run: ./tools/Test-Restore.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: nexa-arena-windows-x64
          path: |
            dist/NexaArena.exe
